<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D File Manager - Виртуальное пространство</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* UI-панели */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            pointer-events: none;
        }
        .panel {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 10px 20px;
            color: white;
            font-size: 14px;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: 500;
        }
        .panel input, .panel button {
            background: rgba(30,30,40,0.9);
            border: 1px solid #4a6fa5;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .panel input {
            cursor: text;
            width: 180px;
        }
        .panel button:hover {
            background: #4a6fa5;
            transform: scale(1.02);
        }
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 16px;
            color: #eee;
            font-size: 13px;
            max-width: 320px;
            pointer-events: none;
            z-index: 100;
            border-left: 4px solid #4caf50;
            font-family: monospace;
        }
        .info-panel h4 {
            margin: 0 0 6px 0;
            color: #ffd966;
        }
        .info-panel p {
            margin: 4px 0;
            word-break: break-word;
        }
        #path-display {
            background: #1e2a3a;
            font-family: monospace;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
            pointer-events: none;
            z-index: 100;
        }
        .context-menu {
            position: absolute;
            background: #222;
            border: 1px solid #555;
            border-radius: 8px;
            box-shadow: 0 4px 15px black;
            z-index: 200;
            min-width: 160px;
            overflow: hidden;
            pointer-events: auto;
        }
        .context-menu div {
            padding: 8px 16px;
            cursor: pointer;
            color: white;
            transition: 0.1s;
        }
        .context-menu div:hover {
            background: #3a6ea5;
        }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            pointer-events: auto;
        }
        .modal-content {
            background: #2d2d2d;
            border-radius: 20px;
            max-width: 80vw;
            max-height: 80vh;
            overflow: auto;
            padding: 20px;
            box-shadow: 0 10px 30px black;
        }
        .modal-content img, .modal-content video {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 12px;
        }
        .close-modal {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 12px;
        }
        a {
            color: #88ccff;
        }
        @media (max-width: 700px) {
            .panel { padding: 6px 12px; }
            .panel input { width: 120px; }
            .info-panel { font-size: 10px; max-width: 250px; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="panel">
            <span>📁 3D Explorer</span>
            <button id="backBtn" style="margin-left: 12px;">◀ Назад</button>
        </div>
        <div class="panel">
            <input type="text" id="searchInput" placeholder="🔍 Поиск по имени..." autocomplete="off">
            <button id="filterBtn">Фильтр</button>
            <button id="resetFilterBtn">Сброс</button>
        </div>
        <div class="panel" id="path-display">
            📂 Путь: <span id="currentPathLabel">/</span>
        </div>
    </div>
    <div id="controls-hint">
        🖱️ WASD — движение | Мышь — осмотр | ЛКМ/Enter — открыть | ПКМ — меню
    </div>
    <div class="info-panel" id="infoPanel">
        <h4>📄 Информация об объекте</h4>
        <p>Выберите файл или папку</p>
    </div>

    <!-- Контекстное меню (скрытое) -->
    <div id="contextMenu" class="context-menu" style="display: none;"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ---------- 1. ИНИЦИАЛИЗАЦИЯ THREE.JS ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // тени для глубины
        document.body.appendChild(renderer.domElement);
        
        // CSS2 рендер для текстов (всегда лицом к камере)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // Освещение
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.receiveShadow = false;
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.3);
        backLight.position.set(-2, 2, -4);
        scene.add(backLight);
        
        // Пол / сетка для ориентации в пространстве
        const gridHelper = new THREE.GridHelper(30, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);
        const floorPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(25, 25),
            new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.7, metalness: 0.1, transparent: true, opacity: 0.4 })
        );
        floorPlane.rotation.x = -Math.PI / 2;
        floorPlane.position.y = -0.5;
        floorPlane.receiveShadow = true;
        scene.add(floorPlane);
        
        // Группа для всех интерактивных объектов (файлы/папки)
        let objectsGroup = new THREE.Group();
        scene.add(objectsGroup);
        
        // ---------- 2. УПРАВЛЕНИЕ ОТ ПЕРВОГО ЛИЦА (WASD + Мышь) ----------
        const keyState = { w: false, s: false, a: false, d: false };
        let moveSpeed = 5.5;
        let mouseX = 0, mouseY = 0;
        let yaw = -Math.PI / 4;
        let pitch = 0;
        let pointerLock = false;
        
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyState.w = true;
            if (key === 's') keyState.s = true;
            if (key === 'a') keyState.a = true;
            if (key === 'd') keyState.d = true;
            if (key === 'enter' && selectedObject3D) {
                openObject(selectedObject3D.userData.item);
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyState.w = false;
            if (key === 's') keyState.s = false;
            if (key === 'a') keyState.a = false;
            if (key === 'd') keyState.d = false;
        });
        
        // Захват мыши для FPS
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        document.addEventListener('pointerlockchange', lockChange);
        function lockChange() {
            pointerLock = document.pointerLockElement === renderer.domElement;
            if (pointerLock) {
                document.addEventListener('mousemove', onMouseMove);
            } else {
                document.removeEventListener('mousemove', onMouseMove);
            }
        }
        function onMouseMove(e) {
            if (!pointerLock) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            if (pitch > Math.PI / 2.2) pitch = Math.PI / 2.2;
            if (pitch < -Math.PI / 2.2) pitch = -Math.PI / 2.2;
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }
        
        function updateMovement(deltaTime) {
            if (!pointerLock) return;
            const actualSpeed = moveSpeed * deltaTime;
            const forward = new THREE.Vector3();
            const right = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            right.crossVectors(new THREE.Vector3(0, 1, 0), forward);
            let move = new THREE.Vector3(0, 0, 0);
            if (keyState.w) move.add(forward);
            if (keyState.s) move.sub(forward);
            if (keyState.a) move.add(right);
            if (keyState.d) move.sub(right);
            move.multiplyScalar(actualSpeed);
            camera.position.add(move);
            // Небольшое ограничение по границам сцены
            camera.position.x = Math.min(12, Math.max(-12, camera.position.x));
            camera.position.z = Math.min(12, Math.max(-12, camera.position.z));
            camera.position.y = 1.6;
        }
        
        // ---------- 3. ВИРТУАЛЬНАЯ ФАЙЛОВАЯ СИСТЕМА (API) ----------
        // Структура: храним данные по абсолютным путям
        const fsTree = {
            "/": [
                { type: "folder", name: "Изображения", size: 0, lastModified: "2025-02-10", path: "/Изображения" },
                { type: "folder", name: "Видео", size: 0, lastModified: "2025-02-11", path: "/Видео" },
                { type: "folder", name: "Документы", size: 0, lastModified: "2025-02-09", path: "/Документы" },
                { type: "file", name: "screenshot_demo.jpg", size: "245 KB", lastModified: "2025-02-01", mime: "image/jpeg", url: "https://threejs.org/examples/textures/uv_grid_opengl.jpg", path: "/screenshot_demo.jpg" },
                { type: "file", name: "presentation.pdf", size: "1.2 MB", lastModified: "2025-01-28", mime: "application/pdf", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", path: "/presentation.pdf" }
            ],
            "/Изображения": [
                { type: "file", name: "landscape.jpg", size: "890 KB", lastModified: "2025-02-05", mime: "image/jpeg", url: "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg", path: "/Изображения/landscape.jpg" },
                { type: "file", name: "icon.png", size: "56 KB", lastModified: "2025-02-03", mime: "image/png", url: "https://threejs.org/examples/textures/uv_grid_opengl.jpg", path: "/Изображения/icon.png" }
            ],
            "/Видео": [
                { type: "file", name: "sample_video.mp4", size: "3.4 MB", lastModified: "2025-02-07", mime: "video/mp4", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", path: "/Видео/sample_video.mp4" },
                { type: "file", name: "tutorial.webm", size: "2.1 MB", lastModified: "2025-02-02", mime: "video/webm", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunflies.mp4", path: "/Видео/tutorial.webm" }
            ],
            "/Документы": [
                { type: "file", name: "manual.pdf", size: "2.8 MB", lastModified: "2025-02-08", mime: "application/pdf", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf", path: "/Документы/manual.pdf" },
                { type: "file", name: "notes.txt", size: "12 KB", lastModified: "2025-02-06", mime: "text/plain", url: "#", path: "/Документы/notes.txt" }
            ]
        };
        // Для текстового файла добавим реальный контент через data URL
        fsTree["/Документы"][1].url = "data:text/plain;charset=utf-8,Это пример текстового документа%0AВиртуальный файловый менеджер 3D";

        // Симуляция API: получить содержимое папки по пути
        function getFolderContents(folderPath) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const contents = fsTree[folderPath] || [];
                    resolve(contents);
                }, 50);
            });
        }
        
        // Текущее состояние
        let currentPath = "/";
        let currentItems = [];          // элементы текущей папки
        let filterQuery = "";
        let selectedObject3D = null;
        let contextMenuItem = null;
        
        // Обновить 3D сцену на основе currentPath и фильтра
        async function refreshScene() {
            // Очищаем группу
            while(objectsGroup.children.length) {
                objectsGroup.remove(objectsGroup.children[0]);
            }
            const contents = await getFolderContents(currentPath);
            let filtered = contents;
            if (filterQuery.trim() !== "") {
                filtered = contents.filter(item => item.name.toLowerCase().includes(filterQuery.toLowerCase()));
            }
            currentItems = filtered;
            
            // Расположение объектов сеткой (X, Z)
            const startX = -3.5;
            const startZ = -2;
            const stepX = 2.8;
            const stepZ = 2.8;
            const maxCols = 5;
            
            filtered.forEach((item, idx) => {
                const col = idx % maxCols;
                const row = Math.floor(idx / maxCols);
                const posX = startX + col * stepX;
                const posZ = startZ + row * stepZ;
                const posY = 0;
                
                // Создаём визуальный куб
                const isFolder = item.type === "folder";
                const color = isFolder ? 0x5a9c5e : 0x4a7aa9;
                const emissive = isFolder ? 0x226622 : 0x224466;
                const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                const material = new THREE.MeshStandardMaterial({ color: color, emissive: emissive, emissiveIntensity: 0.2, roughness: 0.3 });
                const cube = new THREE.Mesh(geometry, material);
                cube.castShadow = true;
                cube.receiveShadow = false;
                cube.position.set(posX, posY + 0.6, posZ);
                
                // Добавляем вращающуюся анимацию для папок
                cube.userData = { item: item, isFolder };
                objectsGroup.add(cube);
                
                // CSS2D текст (имя файла)
                const div = document.createElement('div');
                div.textContent = item.name.length > 15 ? item.name.slice(0,12)+'...' : item.name;
                div.style.backgroundColor = 'rgba(0,0,0,0.6)';
                div.style.color = '#f0f0f0';
                div.style.padding = '4px 10px';
                div.style.borderRadius = '20px';
                div.style.fontSize = '14px';
                div.style.fontWeight = 'bold';
                div.style.border = `1px solid ${isFolder ? '#88ff88' : '#88aaff'}`;
                div.style.whiteSpace = 'nowrap';
                div.style.fontFamily = 'sans-serif';
                div.style.backdropFilter = 'blur(4px)';
                const label = new CSS2DObject(div);
                label.position.set(posX, posY + 1.1, posZ);
                objectsGroup.add(label);
                
                // Добавляем маленькую иконку-индикатор типа над кубом
                const typeIcon = document.createElement('div');
                typeIcon.textContent = isFolder ? '📁' : (item.mime?.startsWith('image') ? '🖼️' : (item.mime?.startsWith('video') ? '🎬' : '📄'));
                typeIcon.style.fontSize = '20px';
                typeIcon.style.textShadow = '0 0 4px black';
                const iconLabel = new CSS2DObject(typeIcon);
                iconLabel.position.set(posX, posY + 1.35, posZ);
                objectsGroup.add(iconLabel);
            });
            
            // обновить отображение пути
            document.getElementById('currentPathLabel').innerText = currentPath;
        }
        
        // Открыть папку или файл
        async function openObject(item) {
            if (item.type === "folder") {
                // Проверяем существование пути
                if (fsTree[item.path]) {
                    currentPath = item.path;
                    await refreshScene();
                    // Сброс выделения
                    clearSelectedHighlight();
                } else {
                    alert("Папка временно недоступна");
                }
            } else if (item.type === "file") {
                // Открыть/воспроизвести файл с сервера
                const url = item.url;
                const mime = item.mime || "";
                if (mime.startsWith("image/")) {
                    showModalImage(url, item.name);
                } else if (mime.startsWith("video/")) {
                    showModalVideo(url, item.name);
                } else if (mime === "application/pdf") {
                    window.open(url, "_blank");
                } else {
                    // Скачивание или открытие в новой вкладке для текста/прочего
                    if (url && url !== "#") {
                        window.open(url, "_blank");
                    } else {
                        // data:text или создание blob
                        const blob = new Blob(["Содержимое файла-примера"], {type: "text/plain"});
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = item.name;
                        a.click();
                        URL.revokeObjectURL(a.href);
                    }
                }
            }
        }
        
        // Модальные просмотрщики
        function showModalImage(src, title) {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <h3>${title}</h3>
                    <img src="${src}" alt="preview" style="max-width:100%">
                    <br><button class="close-modal">Закрыть</button>
                </div>
            `;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('.close-modal').onclick = () => modalDiv.remove();
        }
        function showModalVideo(src, title) {
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <h3>${title}</h3>
                    <video controls autoplay muted src="${src}" style="max-width:100%; max-height:70vh"></video>
                    <br><button class="close-modal">Закрыть</button>
                </div>
            `;
            document.body.appendChild(modalDiv);
            modalDiv.querySelector('.close-modal').onclick = () => modalDiv.remove();
        }
        
        // Подсветка выбранного объекта
        function clearSelectedHighlight() {
            if (selectedObject3D) {
                if (selectedObject3D.material) selectedObject3D.material.emissiveIntensity = 0.2;
                selectedObject3D = null;
            }
        }
        
        // Raycaster для выбора объекта кликом мыши
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('click', (event) => {
            if (!pointerLock && event.target.closest('.modal')) return;
            // Для кликов вне контекстного меню — скрыть меню
            if (contextMenu.style.display === 'block') hideContextMenu();
            
            // Вычисление raycast для клика
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objectsGroup.children, true);
            let hitMesh = null;
            for (let obj of intersects) {
                if (obj.object.isMesh && objectsGroup.children.includes(obj.object)) {
                    hitMesh = obj.object;
                    break;
                }
            }
            if (hitMesh) {
                clearSelectedHighlight();
                selectedObject3D = hitMesh;
                selectedObject3D.material.emissiveIntensity = 0.7;
                const itemData = hitMesh.userData.item;
                // отобразить информацию в панели
                const infoPanel = document.getElementById('infoPanel');
                infoPanel.innerHTML = `
                    <h4>📄 ${itemData.type === 'folder' ? 'Папка' : 'Файл'}</h4>
                    <p><strong>${itemData.name}</strong><br>
                    Размер: ${itemData.size || '—'}<br>
                    Изменён: ${itemData.lastModified || '—'}<br>
                    Тип: ${itemData.type === 'folder' ? 'директория' : (itemData.mime || 'объект')}
                    </p>
                `;
            } else {
                clearSelectedHighlight();
                document.getElementById('infoPanel').innerHTML = `<h4>📄 Информация об объекте</h4><p>Выберите файл или папку</p>`;
            }
        });
        
        // ----- КОНТЕКСТНОЕ МЕНЮ (правый клик) -----
        function showContextMenu(event, itemData) {
            event.preventDefault();
            hideContextMenu();
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = event.clientX + 'px';
            menu.style.top = event.clientY + 'px';
            contextMenuItem = itemData;
            // генерация опций
            menu.innerHTML = `
                <div data-action="copy">📋 Копировать</div>
                <div data-action="move">✂️ Переместить</div>
                <div data-action="delete">🗑️ Удалить</div>
                <div data-action="rename">✏️ Переименовать</div>
            `;
            menu.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const action = btn.dataset.action;
                    await handleContextAction(action, contextMenuItem);
                    hideContextMenu();
                });
            });
        }
        
        async function handleContextAction(action, item) {
            if (!item) return;
            // Операции копирования, перемещения, удаления, переименования
            if (action === 'copy') {
                // копируем в текущую папку (создаём копию)
                const newName = item.name.includes('.') ? 
                    item.name.replace(/(\.[^.]+)$/, '_копия$1') : item.name + '_копия';
                const newItem = { ...item, name: newName, path: currentPath + '/' + newName };
                if (item.type === 'folder') {
                    alert("Копирование папок в демо упрощено, создана запись");
                    if (!fsTree[currentPath]) fsTree[currentPath] = [];
                    fsTree[currentPath].push({ ...newItem, type: 'folder', size: 0, path: currentPath + '/' + newName });
                } else {
                    if (!fsTree[currentPath]) fsTree[currentPath] = [];
                    fsTree[currentPath].push({ ...newItem, type: 'file' });
                }
                await refreshScene();
            } 
            else if (action === 'move') {
                const targetPath = prompt("Введите путь для перемещения (пример: /Документы):", currentPath);
                if (targetPath && fsTree[targetPath]) {
                    // удаляем из текущей папки
                    const idx = currentItems.findIndex(i => i.name === item.name && i.type === item.type);
                    if (idx !== -1 && fsTree[currentPath]) {
                        fsTree[currentPath].splice(idx, 1);
                    }
                    if (!fsTree[targetPath]) fsTree[targetPath] = [];
                    const movedItem = { ...item, path: targetPath + '/' + item.name };
                    fsTree[targetPath].push(movedItem);
                    await refreshScene();
                } else alert("Папка не существует");
            }
            else if (action === 'delete') {
                if (confirm(`Удалить ${item.name}?`)) {
                    const idx = currentItems.findIndex(i => i.name === item.name && i.type === item.type);
                    if (idx !== -1 && fsTree[currentPath]) {
                        fsTree[currentPath].splice(idx, 1);
                        await refreshScene();
                        clearSelectedHighlight();
                    }
                }
            }
            else if (action === 'rename') {
                const newName = prompt("Новое имя:", item.name);
                if (newName && newName.trim() !== "") {
                    const idx = currentItems.findIndex(i => i.name === item.name && i.type === item.type);
                    if (idx !== -1 && fsTree[currentPath]) {
                        fsTree[currentPath][idx].name = newName;
                        fsTree[currentPath][idx].path = currentPath + '/' + newName;
                        await refreshScene();
                    }
                }
            }
        }
        
        function hideContextMenu() {
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'none';
            contextMenuItem = null;
        }
        
        window.addEventListener('contextmenu', (event) => {
            // raycast для определения объекта под курсором в момент ПКМ
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objectsGroup.children, true);
            let hit = null;
            for (let obj of intersects) {
                if (obj.object.isMesh && objectsGroup.children.includes(obj.object)) {
                    hit = obj.object;
                    break;
                }
            }
            if (hit && hit.userData.item) {
                showContextMenu(event, hit.userData.item);
            } else {
                hideContextMenu();
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.context-menu')) hideContextMenu();
        });
        
        // ----- НАВИГАЦИЯ И ПОИСК -----
        document.getElementById('backBtn').addEventListener('click', async () => {
            if (currentPath === "/") return;
            const parentPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
            const newPath = parentPath === "" ? "/" : parentPath;
            currentPath = newPath;
            await refreshScene();
        });
        
        document.getElementById('filterBtn').addEventListener('click', async () => {
            filterQuery = document.getElementById('searchInput').value;
            await refreshScene();
        });
        document.getElementById('resetFilterBtn').addEventListener('click', async () => {
            document.getElementById('searchInput').value = "";
            filterQuery = "";
            await refreshScene();
        });
        document.getElementById('searchInput').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                filterQuery = e.target.value;
                await refreshScene();
            }
        });
        
        // Анимация и запуск
        let lastTime = performance.now();
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;
            updateMovement(delta);
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        // Инициализация и первый рендер
        async function init() {
            await refreshScene();
            animate();
        }
        init();
        
        // Обработка resize окна
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Дополнительно: сделать так, чтобы Enter открывал выделенный объект
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && selectedObject3D) {
                openObject(selectedObject3D.userData.item);
            }
        });
        
        // Стилизация вспомогательная
        console.log("3D File Manager запущен. Управление: WASD, мышь, клик по объекту");
    </script>
</body>
</html>
