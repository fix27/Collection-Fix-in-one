<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        #app {
            display: flex;
            gap: 40px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            flex-wrap: wrap;
            max-width: 900px;
        }
        #controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 200px;
        }
        .param {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .param label {
            margin-right: 5px;
            font-size: 14px;
        }
        .param input[type="number"] {
            width: 60px;
        }
        button {
            padding: 8px 12px;
            font-weight: bold;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #speedControl {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #stats {
            background: #fafafa;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
        }
        #building {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 150px;
        }
        .floor-label {
            font-weight: bold;
            margin: 5px 0;
        }
        #shaft {
            position: relative;
            width: 80px;
            height: 300px;
            background: #e0e0e0;
            border: 2px solid #555;
            overflow: hidden;
        }
        #elevator {
            position: absolute;
            left: 10px;
            width: 60px;
            height: 40px;
            background: #3498db;
            border: 1px solid #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            transition: top 0.1s linear;
        }
        progress {
            width: 100%;
        }
        .progress-group {
            margin: 5px 0;
        }
        .progress-group span {
            display: inline-block;
            width: 60px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="controls">
            <h3>Parameters</h3>
            <div class="param">
                <label>QueuePerM:</label>
                <input type="number" id="QueuePerM" value="1" min="0" max="20" step="1">
            </div>
            <div class="param">
                <label>QueuePerD:</label>
                <input type="number" id="QueuePerD" value="3" min="0" max="20" step="1">
            </div>
            <div class="param">
                <label>Floor:</label>
                <input type="number" id="Floor" value="2" min="1" max="10" step="1">
            </div>
            <div class="param">
                <label>TimeOutM:</label>
                <input type="number" id="TimeOutM" value="10" min="0" max="100" step="1">
            </div>
            <div class="param">
                <label>TimeOutSee:</label>
                <input type="number" id="TimeOutSee" value="20" min="0" max="100" step="1">
            </div>
            <div>
                <button id="startStopBtn">Start</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div id="speedControl">
                <span>Speed:</span>
                <input type="range" id="speedSlider" min="1" max="10" value="1">
                <span id="speedValue">1</span>
            </div>
        </div>

        <div id="stats">
            <div>Time: <span id="timeDisplay">08:00:00</span></div>
            <div>Lost clients: <span id="lostDisplay">0</span></div>
            <div>Moves: <span id="movesDisplay">0</span></div>
            <div>Idle: <span id="idleDisplay">0</span></div>
            <div>Avg pass/trip: <span id="avgPassDisplay">0</span></div>
            <div>Avg cycle time: <span id="avgCycleDisplay">0</span></div>
            <div class="progress-group">
                <span>Queue:</span>
                <progress id="queueBar" max="20" value="0"></progress>
                <span id="queueText">0</span>
            </div>
            <div class="progress-group">
                <span>Elevator:</span>
                <progress id="elevBar" max="8" value="0"></progress>
                <span id="elevText">0</span>
            </div>
            <div class="progress-group">
                <span>Upper wait:</span>
                <progress id="upperBar" max="8" value="0"></progress>
                <span id="upperText">0</span>
            </div>
        </div>

        <div id="building">
            <div class="floor-label" id="upperFloorLabel">Upper floor (wait: 0)</div>
            <div id="shaft">
                <div id="elevator">0</div>
            </div>
            <div class="floor-label" id="lowerFloorLabel">Lobby (queue: 0)</div>
        </div>
    </div>

    <script>
        // --- simulation state ---
        let vspeed = 0;
        let vHeight = 0;
        let vCountPupil = 0;      // passengers inside elevator
        let vCountPupilSee = 0;   // passengers waiting on upper floor
        let vTimeOutSee = 0;
        let vTimeOut = 0;
        let vQueue = 0;
        let updown = -1;          // -1 = bottom, 1 = top, 0 = moving
        let countup = 0;
        let sum = 0;
        let ci = 0, co = 0, cm = 0, coi = 0;
        let ccp = 0, ccm = 0;
        let curtime = new Date();
        let zzz = 0;
        let moves = 0, idle = 0;

        // configurable parameters (read from DOM)
        function readParams() {
            const qPM = parseInt(document.getElementById('QueuePerM').value) || 1;
            const qPD = parseInt(document.getElementById('QueuePerD').value) || 3;
            const fl = parseInt(document.getElementById('Floor').value) || 2;
            const tOutM = parseInt(document.getElementById('TimeOutM').value) || 10;
            const tOutSee = parseInt(document.getElementById('TimeOutSee').value) || 20;
            return { QueuePerM: qPM, QueuePerD: qPD, Floor: fl, TimeOutM: tOutM, TimeOutSee: tOutSee };
        }

        // constants
        const CountPupil = 8;
        const QueueLimit = 20;
        const speedConst = 0.9;
        const FloorHeight = 3.5;
        const TimeB = 8, TimeE = 18;
        const TimeServiceB = 12, TimeServiceMin = 30;

        // helper: check working hours (excluding lunch break)
        function bb() {
            const h = curtime.getHours();
            const m = curtime.getMinutes();
            if (h < TimeB || h >= TimeE) return false;
            if (h === TimeServiceB && m <= TimeServiceMin) return false;
            return true;
        }

        function resetSimulation() {
            vspeed = 0;
            vHeight = 0;
            vCountPupil = 0;
            vCountPupilSee = 0;
            vTimeOutSee = 0;
            vTimeOut = 0;
            vQueue = 0;
            updown = -1;
            countup = 0;
            sum = 0;
            ci = 0; co = 0; cm = 0; coi = 0;
            ccp = 0; ccm = 0;
            curtime = new Date();
            curtime.setHours(8, 0, 0, 0);
            zzz = 0;
            moves = 0; idle = 0;
            updateDisplay();
        }

        function doStep() {
            const params = readParams();
            const QueuePerM = params.QueuePerM;
            const QueuePerD = params.QueuePerD;
            const Floor = params.Floor;
            const TimeOutM = params.TimeOutM;
            const TimeOutSee = params.TimeOutSee;

            // --- cycle start detection ---
            if (cm === 0) coi = ci;
            cm++;

            // --- loading at bottom ---
            if (updown === -1 && bb()) {
                while (vCountPupil < CountPupil && vQueue > 0) {
                    vQueue--;
                    vCountPupil++;
                }
            }

            // --- increment timeouts ---
            if (vTimeOutSee < TimeOutSee) vTimeOutSee++;
            if (vTimeOut < TimeOutM) vTimeOut++;

            // --- exchange passengers at top if arriving ---
            if (updown === 1) {
                vspeed = -speedConst;
                // swap vCountPupil and vCountPupilSee
                let tmp = vCountPupil;
                vCountPupil = vCountPupilSee;
                vCountPupilSee = tmp;
            }

            // --- departure conditions from bottom to top ---
            if ((!bb() || vTimeOutSee >= TimeOutSee) && updown === -1 && vCountPupilSee > 0) {
                vspeed = speedConst;
                vTimeOutSee = 0;
            }
            if ((vCountPupil === CountPupil || (vTimeOut >= TimeOutM && vCountPupil > 0)) && updown === -1) {
                vspeed = speedConst;
                vTimeOut = 0;
            }

            // --- passenger arrival to queue ---
            let tp = 0;
            if (bb()) {
                tp = Math.floor(Math.random() * (QueuePerD + 1)) + QueuePerM;
            } else {
                tp = 0;
                vQueue = 0; // clear queue outside working hours
            }
            vQueue += tp;
            if (vQueue > QueueLimit) {
                const overflow = vQueue - QueueLimit;
                document.getElementById('lostDisplay').textContent =
                    (parseInt(document.getElementById('lostDisplay').textContent) + overflow).toString();
                ci += tp - overflow;
                vQueue = QueueLimit;
            } else {
                ci += tp;
            }

            // --- update stats (moves/idle) ---
            if (vspeed !== 0) {
                moves++;
            } else {
                idle++;
            }

            // --- cycle time calculation on passenger exit at bottom ---
            if (co > coi) {
                ccp++;
                ccm += cm;
                cm = 0;
                if (ccp > 0) {
                    document.getElementById('avgCycleDisplay').textContent = (ccm / ccp).toFixed(2);
                }
            }

            // --- elevator movement ---
            if (vspeed !== 0) {
                vHeight += vspeed * 3;
                updown = 0;
            }

            // --- arrival at top ---
            if (vHeight >= Floor * FloorHeight && updown !== 1) {
                vHeight = Floor * FloorHeight;
                updown = 1;
                vspeed = 0;
                countup++;
                sum += vCountPupil;
                document.getElementById('avgPassDisplay').textContent = (sum / countup).toFixed(2);
            }

            // --- arrival at bottom ---
            if (vHeight <= 0 && updown !== -1) {
                vHeight = 0;
                updown = -1;
                vspeed = 0;
                countup++;
                sum += vCountPupil;
                co += vCountPupil;
                document.getElementById('avgPassDisplay').textContent = (sum / countup).toFixed(2);
                vCountPupil = 0;
            }

            // --- advance simulation time ---
            curtime.setSeconds(curtime.getSeconds() + 3);

            // --- update UI ---
            updateDisplay();
        }

        function updateDisplay() {
            // time
            const h = curtime.getHours().toString().padStart(2, '0');
            const m = curtime.getMinutes().toString().padStart(2, '0');
            const s = curtime.getSeconds().toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${h}:${m}:${s}`;

            // counts
            document.getElementById('movesDisplay').textContent = moves;
            document.getElementById('idleDisplay').textContent = idle;

            // progress bars
            document.getElementById('queueBar').value = vQueue;
            document.getElementById('queueText').textContent = vQueue;
            document.getElementById('elevBar').value = vCountPupil;
            document.getElementById('elevText').textContent = vCountPupil;
            document.getElementById('upperBar').value = vCountPupilSee;
            document.getElementById('upperText').textContent = vCountPupilSee;

            // floor labels
            document.getElementById('upperFloorLabel').textContent = `Upper floor (wait: ${vCountPupilSee})`;
            document.getElementById('lowerFloorLabel').textContent = `Lobby (queue: ${vQueue})`;

            // elevator position
            const shaft = document.getElementById('shaft');
            const elevator = document.getElementById('elevator');
            const shaftHeight = shaft.clientHeight;
            const elevHeight = elevator.clientHeight;
            const params = readParams();
            const Floor = params.Floor;
            const maxHeight = Floor * FloorHeight;
            let ratio = 0;
            if (maxHeight > 0) ratio = vHeight / maxHeight;
            const topPos = (1 - ratio) * (shaftHeight - elevHeight);
            elevator.style.top = topPos + 'px';
            elevator.textContent = vCountPupil;
        }

        // --- timer control ---
        let timer = null;
        function startTimer() {
            if (timer) return;
            timer = setInterval(() => {
                const speed = parseInt(document.getElementById('speedSlider').value) || 1;
                zzz += speed;
                while (zzz >= 20) {
                    zzz -= 20;
                    doStep();
                }
            }, 50);
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        function toggleTimer() {
            const btn = document.getElementById('startStopBtn');
            if (timer) {
                stopTimer();
                btn.textContent = 'Start';
            } else {
                startTimer();
                btn.textContent = 'Stop';
            }
        }

        // --- event listeners ---
        document.getElementById('startStopBtn').addEventListener('click', toggleTimer);
        document.getElementById('resetBtn').addEventListener('click', () => {
            resetSimulation();
        });
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            document.getElementById('speedValue').textContent = e.target.value;
        });

        // initialise
        window.addEventListener('load', () => {
            resetSimulation();
            // ensure timer is stopped on start
            stopTimer();
            document.getElementById('startStopBtn').textContent = 'Start';
        });
    </script>
</body>
</html>
